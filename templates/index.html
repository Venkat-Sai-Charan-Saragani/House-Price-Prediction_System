<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: aliceblue;
        }

        header {
            background-color: rgb(19, 18, 18);
            color: beige;
            padding: 10px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: aliceblue;
            box-shadow: black;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: aliceblue;
            color: antiquewhite;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        /* adding styling for the form */
        form {
            margin: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
        }

        button {
            background-color: rgb(21, 22, 22);
            color: rgb(13, 14, 14);
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        /* style for displaying the predicted price */
        #predictedPrice {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>

</head>
<body>
    <header>
        <h1>House Price Prediction</h1>
    </header>
    <main>
        <p>Welcome to House Price Prediction Model!</p>

        <!-- form for input fields -->

<form id = "predictionForm">
    <label for="beds">Beds:</label>
    <select name="beds" id="beds">
        <option value="" disabled selected>Select Number of bedrooms</option>
        {% for bed in bedrooms %}
        <option value="{{bed}}">{{bed}}</option>
        {% endfor %}
    </select>

    <label for="baths">Baths:</label>
    <select name="baths" id="baths">
        <option value="" disabled selected>Select number of bathrooms</option>
        {% for bath in bathrooms %}
        <option value="{{ bath }}">{{bath}}</option>
        {% endfor %}
    </select>


    <label for="size">Size:</label>
    <select name="size" id="size">
    <option value="" disabled selected>select size of the House</option>
    {% for house_size in sizes %}
    <option value="{{ house_size }}">{{house_size}} sqft</option>
    {% endfor %}
    </select>
    
    <label for="zip_code">Zip_code:</label>
    <select name="zip_code" id="zip_code">
        <option value="" disabled selected>Select the zip code</option>
        {% for z in zip_codes %}
        <option value= "{{ z }}">{{z}} sqft</option>
        {% endfor %}
    </select>


    <!-- Predict Price Button -->
     <button type="button" onclick="sendData()">Predict Price</button>

     <!-- Space for displaying predicted price -->
      <div id="predictedPrice"></div>
</form>
    </main>
    <footer>
        <p>&copy; 2025 House Price Prediction. All Rights Reserved</p>
    </footer>
    <!--  add your javascript Scripts or include external scripts here  -->
      <script>
        // javascript function to fetch options from dropdrowns
        function fetchOptions(endpoint, dropdrowns) {
            fetch(endpoint)
            .then(response => response.json())
            .then(data =>{
                const dropdrown = document.getElementById(dropdrownId);
                dropdrown.innerHTML = '<option value=""disabled selected>select an option</option>'
                data.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option;
                    optionElement.textContent = option;
                    dropdrown.appendChild(optionElement);
                });
            });
        }

        // Fetch options for each dropdown on page load
        window.onload = function() {
            fetchOptions('/bedrooms', 'beds');
            fetchOptions('/bathrooms', 'baths');
            fetchOptions('/sizes', 'size');
            fetchOptions('/zip_codes', 'zip_code');
        };

        // Javascript fnction to send data and recieve predcted price
        function sendData(){
            const form = document.getElementById('predictionForm');
            const formData = new FormData(form);

            fetch('/predict',{
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(price => {
                document.getElementById('predictedPrice').innerHTML = 'price: INR ' + price;
            });

            
        }
      </script>
</body>
</html>
